name: Daily India Soil Moisture Export

on:
  schedule:
    # Runs at 07:00 UTC daily = 12:30 PM IST. Adjust the hour as needed -
    # GitHub Actions cron always uses UTC, never local time.
    - cron: '0 7 * * *'
  workflow_dispatch:  # lets you also trigger it manually from the Actions tab

jobs:
  export-soil-moisture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install earthengine-api

      - name: Run soil moisture export
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
        run: python gh_daily_soil_moisture.py
